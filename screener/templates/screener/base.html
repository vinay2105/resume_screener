<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Smart Resume Screener — AI-powered resume analysis using Google Gemini">
  <title>{% block title %}Smart Resume Screener{% endblock %}</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary:    #0a0e1a;
      --bg-card:       rgba(255,255,255,0.04);
      --bg-card-hover: rgba(255,255,255,0.07);
      --border-glass:  rgba(255,255,255,0.08);
      --accent:        #6c63ff;
      --accent-glow:   rgba(108,99,255,0.35);
      --success-soft:  #00e676;
      --warning-soft:  #ffc400;
      --danger-soft:   #ff5252;
      --text-primary:  #e8e6f0;
      --text-muted:    #8b87a0;
    }
    * { font-family: 'Inter', sans-serif; }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }
    /* Animated gradient blob in background */
    body::before {
      content: '';
      position: fixed; top: -30%; left: -10%;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      border-radius: 50%;
      animation: floatBlob 20s ease-in-out infinite alternate;
      z-index: -1;
      pointer-events: none;
    }
    @keyframes floatBlob {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30vw, 20vh) scale(1.3); }
    }

    /* Glass card */
    .glass {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      transition: background .2s;
    }
    .glass:hover { background: var(--bg-card-hover); }

    /* Navbar */
    .navbar {
      background: rgba(10,14,26,0.85) !important;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-glass);
    }
    .navbar-brand {
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-link { color: var(--text-muted) !important; transition: color .2s; }
    .nav-link:hover, .nav-link.active { color: var(--text-primary) !important; }

    /* Fade-in animation */
    .fade-in {
      animation: fadeInUp 0.6s ease-out both;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Form inputs */
    .form-control, .form-select {
      background: rgba(255,255,255,0.05);
      border-color: var(--border-glass);
      color: var(--text-primary);
    }
    .form-control:focus, .form-select:focus {
      background: rgba(255,255,255,0.08);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
      color: var(--text-primary);
    }
    .form-label { color: var(--text-muted); font-weight: 500; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Buttons */
    .btn-accent {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 12px 32px;
      border-radius: 12px;
      transition: transform .15s, box-shadow .15s;
    }
    .btn-accent:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px var(--accent-glow);
      color: #fff;
    }

    /* Score circle */
    .score-ring {
      width: 160px; height: 160px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; font-weight: 800;
      position: relative;
      margin: 0 auto;
    }
    .score-ring::after {
      content: '%';
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-muted);
      position: absolute;
      bottom: 38px;
      right: 38px;
    }

    /* Skill badges */
    .skill-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      margin: 3px;
      border: 1px solid;
    }
    .skill-matched { background: rgba(0,230,118,0.1); border-color: rgba(0,230,118,0.3); color: var(--success-soft); }
    .skill-missing { background: rgba(255,82,82,0.1); border-color: rgba(255,82,82,0.3); color: var(--danger-soft); }
    .skill-ats     { background: rgba(108,99,255,0.1); border-color: rgba(108,99,255,0.3); color: var(--accent); }

    /* Loading overlay */
    #loading-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(10,14,26,0.9);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }
    #loading-overlay.active { display: flex; }
    .loader {
      width: 48px; height: 48px;
      border: 4px solid var(--border-glass);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Table */
    .table-dark-custom th { color: var(--text-muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .table-dark-custom td { color: var(--text-primary); vertical-align: middle; }
    .table-dark-custom tbody tr { transition: background .15s; }
    .table-dark-custom tbody tr:hover { background: var(--bg-card-hover); }

    /* Footer */
    footer { border-top: 1px solid var(--border-glass); color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="loader"></div>
    <p class="text-muted fw-medium">Analyzing with Gemini AI…</p>
  </div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="{% url 'screener:home' %}">
        <i class="bi bi-stars me-2"></i>Smart Resume Screener
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'screener:home' %}"><i class="bi bi-house me-1"></i>Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'screener:history' %}"><i class="bi bi-clock-history me-1"></i>History</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Flash messages -->
  <div class="container mt-3">
    {% if messages %}
    {% for msg in messages %}
    <div class="alert alert-{{ msg.tags }} alert-dismissible fade show glass" role="alert" style="border-color: {% if msg.tags == 'error' %}var(--danger-soft){% elif msg.tags == 'success' %}var(--success-soft){% else %}var(--accent){% endif %};">
      <i class="bi {% if msg.tags == 'error' %}bi-exclamation-triangle{% elif msg.tags == 'success' %}bi-check-circle{% else %}bi-info-circle{% endif %} me-2"></i>
      {{ msg }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% endif %}
  </div>

  <!-- Main content -->
  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="text-center py-4 mt-5">
    <small>Smart Resume Screener &copy; 2025 — Powered by Google Gemini AI</small>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Show loading overlay on form submit
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('analysis-form');
      if (form) {
        form.addEventListener('submit', function() {
          document.getElementById('loading-overlay').classList.add('active');
        });
      }
    });
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
